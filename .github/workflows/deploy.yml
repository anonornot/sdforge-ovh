name: Build and Push to GHCR

on:
  push:
    branches:
      - main  # veya kodunuzu hangi branch'e push ediyorsanız

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sdforge-ovh:0.1.2
          # GitHub Actions içinde cache kullanarak sonraki buildleri saniyelik yapar:
          cache-from: type=gha
          cache-to: type=gha,mode=max
